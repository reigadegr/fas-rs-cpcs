[workspace]
resolver = "2"
members = [
  "xtask",
  "cpcs-analyzer",
  "cpcs-analyzer-common",
  "cpcs-analyzer-ebpf",
]
default-members = [".", "xtask", "cpcs-analyzer"]

[package]
name = "fas-rs"
version = "4.9.1"
edition = "2024"
description = "Frame aware scheduling for android. Requires kernel ebpf support."
authors = ["shadow3"]
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/shadow3aaa/fas-rs"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }
similar_names = "allow"
missing_errors_doc = "allow"
missing_safety_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"

[dependencies]
likely_stable = "0.1.3"
parking_lot = "0.12.5"
thiserror = "2.0.18"
log = "0.4.29"
anyhow = { version = "1.0.102" }
inotify = { version = "0.11.1", default-features = false }
flexi_logger = "0.31.9"
libc = "0.2.186"
rustix = { version = "1.1.4", features = ["mount", "thread"] }
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
sys-mount = { version = "3.1.0", default-features = false }
quick-xml = { version = "0.40.1", features = ["serialize"] }
mlua = { version = "0.11.6", features = ["luajit", "vendored", "error-send"] }
frame-analyzer = { path = "third_party/frame-analyzer-patched" }
dumpsys-rs = { git = "https://github.com/shadow3aaa/dumpsys-rs" }
mimalloc = { version = "0.1.52", features = ["v2", "no_thp", "override"] }
num_cpus = "1.17.0"
nix = { version = "0.31.3", features = ["sched"] }
cpcs-analyzer = { path = "cpcs-analyzer" }

[build-dependencies]
anyhow = "1.0.102"
toml = "1.1.2"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
rocket = { version = "0.5.1", features = ["json"] }

[profile.dev]
overflow-checks = false
opt-level = 3
strip = true

[profile.release]
overflow-checks = false
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
